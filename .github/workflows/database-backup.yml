name: Encrypted database backup
on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"
permissions:
  contents: read
concurrency: database-backup
jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.DATABASE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    container: postgres:18
    environment: database-backups
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: apt-get update && apt-get install -y --no-install-recommends gnupg ca-certificates libatomic1
      - run: node scripts/backup-database.mjs
        env:
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
          BACKUP_GPG_RECIPIENT: ${{ vars.BACKUP_GPG_RECIPIENT }}
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup
          path: backups/*.dump.gpg
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      # Private decryption keys are never configured in this workflow.
